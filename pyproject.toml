[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accountor-agent"
version = "0.1.0"
description = "A small Python agent for turning Zalo message data into structured Excel rows"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
